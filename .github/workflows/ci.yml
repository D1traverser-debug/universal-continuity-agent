name: continuity-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: Run risk-tiered control-plane audit
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          else
            mapfile -t changed < <(git ls-files)
          fi
          args=()
          for path in "${changed[@]}"; do
            args+=(--changed-path "$path")
          done
          python -m runtime.system_audit --repo-root . --trigger routine_change "${args[@]}"
      - run: python -m pytest -q
