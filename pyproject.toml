[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-continuity-agent"
version = "3.5.0"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["runtime"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
